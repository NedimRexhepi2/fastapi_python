<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FastAPI TypeScript Client</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 900px; display: flex; gap: 40px; }
        .column-left { display: flex; flex-direction: column; gap: 20px; width: 400px; }
        .column-right { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .section { padding: 20px; border: 1px solid #ddd; border-radius: 8px; background: #fdfdfd; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; }
        input { padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; background-color: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0051a8; }
        #userList { margin-top: 15px; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="column-left">
        <div class="section">
            <h2>Create New User</h2>
            <form id="userForm">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="average">Average Score:</label>
                    <input type="number" id="average" step="0.1" required>
                </div>
                <button type="submit" style="width: 100%;">Submit User Data</button>
            </form>
        </div>

        <div class="section">
            <h2>Find User By ID</h2>
            <div class="form-group" style="flex-direction: row; gap: 10px;">
                <input type="number" id="searchId" placeholder="Enter User ID" style="flex: 1;">
                <button id="searchBtn">Search</button>
            </div>
            <div id="singleUserView"></div>
        </div>
    </div>

    <div class="column-right">
        <div class="section" id="editSection" style="display: none; background-color: #f9f9f9; border-color: #0070f3;">
            <h2>Edit User</h2>
            <form id="editForm">
                <input type="hidden" id="editUserId">
                <div class="form-group">
                    <label for="editUsername">Username:</label>
                    <input type="text" id="editUsername" required>
                </div>
                <div class="form-group">
                    <label for="editAverage">Average Score:</label>
                    <input type="number" id="editAverage" step="0.1" required>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" style="flex: 1; background-color: #28a745;">Save Changes</button>
                    <button type="button" id="cancelEditBtn" style="flex: 1; background-color: #6c757d;">Cancel</button>
                </div>
            </form>
        </div>

        <div class="section">
            <h2>All Users in Database</h2>
            <div id="userList">Loading users...</div>
        </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
</body>
</html>
